<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Your Password</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f4f5; font-family: Arial, sans-serif;">
<table width="100%" cellpadding="0" cellspacing="0" style="padding: 40px 0;">
    <tr>
        <td align="center">
            <table width="480" cellpadding="0" cellspacing="0" style="background:#ffffff; border-radius:8px; overflow:hidden;">
                <tr>
                    <td style="background:#1f2937; padding:24px; text-align:center;">
                        <h1 style="color:#ffffff; margin:0; font-size:20px;">EBookStore</h1>
                    </td>
                </tr>
                <tr>
                    <td style="padding:32px;">
                        <h2 style="margin-top:0; color:#111827;">Reset your password</h2>
                        <p style="color:#4b5563; line-height:1.5;">
                            We received a request to reset your password. Click the button below to choose a new one. This link will expire in <strong th:text="${expiryMinutes}">15</strong> minutes.
                        </p>
                        <table cellpadding="0" cellspacing="0" style="margin: 24px 0;">
                            <tr>
                                <td style="border-radius:6px; background:#2563eb;">
                                    <a th:href="${resetLink}"
                                       style="display:inline-block; padding:12px 28px; color:#ffffff; text-decoration:none; font-weight:bold; border-radius:6px;">
                                        Reset Password
                                    </a>
                                </td>
                            </tr>
                        </table>
                        <p style="color:#9ca3af; font-size:13px; line-height:1.5;">
                            If you didn't request this, you can safely ignore this email — your password will not be changed.
                        </p>
                        <p style="color:#9ca3af; font-size:12px; word-break:break-all;">
                            Or copy this link: <span th:text="${resetLink}">link</span>
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
